<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKI GRV Return Requests — CS Rep</title>
<style>
  :root{
    --gold:#d4af37; --gold-dark:#b8942e; --gold-light:#f0c75e;
    --bg:#181310; --card:#241d15; --card2:#2d251a;
    --border:rgba(212,175,55,0.22); --border-soft:rgba(212,175,55,0.14);
    --text:#f6ecd9; --muted:#b9a98d; --danger:#e5484d; --ok:#2ecc71;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:radial-gradient(ellipse at top, #201810, var(--bg) 55%); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; min-height:100vh;}
  header{position:sticky; top:0; background:linear-gradient(135deg,#241d15,#181310); border-bottom:1px solid var(--border); padding:14px 20px; display:flex; justify-content:space-between; align-items:center; z-index:10; flex-wrap:wrap; gap:8px;}
  header h1{font-size:18px; margin:0; color:var(--gold-light);}
  header .user{font-size:12px; color:var(--muted);}
  .screen{padding:20px; max-width:1200px; margin:0 auto;}
  .card{background:linear-gradient(160deg, var(--card), #1d1710); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:16px;}
  .toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px;}
  select, input{padding:10px; border-radius:8px; border:1px solid var(--border-soft); background:var(--card2); color:var(--text); font-size:14px;}
  button{cursor:pointer; border:none; border-radius:8px; font-weight:600; font-size:13px; padding:10px 16px;}
  .btn-primary{background:linear-gradient(135deg,var(--gold-light),var(--gold-dark)); color:#1d1710;}
  .btn-secondary{background:var(--card2); color:var(--gold-light); border:1px solid var(--border);}
  .badge{display:inline-block; padding:4px 12px; border-radius:20px; font-size:12px; font-weight:700; background:var(--card2); color:var(--gold-light); border:1px solid var(--border);}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; color:var(--muted); font-weight:600; padding:8px; border-bottom:1px solid var(--border); white-space:nowrap;}
  td{padding:8px; border-bottom:1px solid var(--border-soft); vertical-align:middle;}
  td input{width:100px; font-size:12px; padding:6px;}
  .ref{color:var(--gold); font-weight:700;}
  .status{padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; background:#3a2f10; color:#e0b73f;}
  .empty{text-align:center; color:var(--muted); padding:40px 0;}
  .login-wrap{display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;}
  .err{color:var(--danger); font-size:13px; margin-top:10px; min-height:16px;}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--gold); color:#1a1a1a; padding:12px 20px; border-radius:10px; font-size:14px; font-weight:600; z-index:100;}
  .toast.error{background:var(--danger); color:#fff;}
  .table-wrap{overflow-x:auto;}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <div class="card" style="width:100%; max-width:360px;">
    <h1 style="color:var(--gold-light); text-align:center;">🔄 GRV Requests</h1>
    <div style="text-align:center; color:var(--muted); font-size:12px; margin-bottom:20px;">CS Rep View</div>
    <label style="font-size:12px; color:var(--muted);">Username</label>
    <input id="loginUser" style="width:100%; margin-bottom:12px;" autocomplete="username">
    <label style="font-size:12px; color:var(--muted);">Password</label>
    <input id="loginPass" type="password" style="width:100%; margin-bottom:16px;" autocomplete="current-password">
    <button class="btn-primary" style="width:100%;" onclick="doLogin()">Log In</button>
    <div id="loginError" class="err"></div>
  </div>
</div>

<div id="appShell" style="display:none;">
  <header>
    <h1>🔄 GRV Return Requests</h1>
    <div class="user"><span id="userLabel"></span> · <span onclick="doLogout()" style="text-decoration:underline; cursor:pointer;">Log out</span></div>
  </header>
  <div class="screen">
    <div class="card">
      <div class="toolbar">
        <span class="badge" id="todayBadge">Today: —</span>
        <select id="dateFilter" onchange="loadRequests()">
          <option value="">Today</option>
          <option value="yesterday">Yesterday</option>
          <option value="all">All</option>
        </select>
        <button class="btn-secondary" onclick="loadRequests()">↻ Refresh</button>
        <button class="btn-primary" onclick="downloadAll()">⬇ Download All (ZIP)</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Ref</th><th>Customer</th><th>Account #</th><th>Location</th><th>Salesman</th>
              <th>W/H</th><th>Order Type</th><th>PO</th><th>Email</th><th>Status</th><th>Created</th><th></th>
            </tr>
          </thead>
          <tbody id="reqBody"></tbody>
        </table>
        <div id="emptyState" class="empty" style="display:none;">No requests for this range.</div>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast" style="display:none;"></div>

<script>
let TOKEN = localStorage.getItem('grvcs_token') || null;
let USER = JSON.parse(localStorage.getItem('grvcs_user') || 'null');
let REQUESTS = [];

function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if (TOKEN) opts.headers['x-auth-token'] = TOKEN;
  return fetch(path, opts).then(async r => {
    const data = await r.json().catch(()=>({}));
    if (!r.ok) throw new Error(data.error || 'Request failed');
    return data;
  });
}
function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast' + (isError ? ' error' : '');
  t.style.display = 'block';
  setTimeout(()=>{ t.style.display='none'; }, 3000);
}

async function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  try {
    const data = await api('/api/auth/login', { method:'POST', body: JSON.stringify({username,password}) });
    if (!['grv_cs','superadmin','subadmin'].includes(data.user.role)) {
      errEl.textContent = 'This page is for CS Rep / admin accounts.';
      return;
    }
    TOKEN = data.token; USER = data.user;
    localStorage.setItem('grvcs_token', TOKEN);
    localStorage.setItem('grvcs_user', JSON.stringify(USER));
    initApp();
  } catch(e) { errEl.textContent = e.message; }
}
function doLogout() {
  api('/api/auth/logout', {method:'POST'}).catch(()=>{});
  localStorage.removeItem('grvcs_token'); localStorage.removeItem('grvcs_user');
  location.reload();
}

function initApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appShell').style.display = 'block';
  document.getElementById('userLabel').textContent = USER.full_name || USER.username;
  loadRequests();
}

function currentDateParam() {
  const v = document.getElementById('dateFilter').value;
  if (v === 'all') return 'all';
  if (v === 'yesterday') {
    const d = new Date(); d.setDate(d.getDate()-1);
    return d.toISOString().slice(0,10);
  }
  return new Date().toISOString().slice(0,10);
}

async function loadRequests() {
  try {
    const dateParam = currentDateParam();
    const data = await api('/api/grv/requests?date=' + encodeURIComponent(dateParam));
    REQUESTS = data.requests || [];
    document.getElementById('todayBadge').textContent = 'Today: ' + data.today_count;
    renderTable();
  } catch(e) { showToast(e.message, true); }
}

function renderTable() {
  const body = document.getElementById('reqBody');
  const empty = document.getElementById('emptyState');
  if (!REQUESTS.length) { body.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display = 'none';
  body.innerHTML = REQUESTS.map(r => `
    <tr>
      <td class="ref">${r.request_ref}</td>
      <td>${r.customer_name||''}</td>
      <td>${r.account_number||''}</td>
      <td>${r.location||''}${r.site_use_id?(' ('+r.site_use_id+')'):''}</td>
      <td>${r.salesperson_name||''}</td>
      <td><input value="${r.warehouse||''}" onchange="fieldChange(${r.id},'warehouse',this.value)"></td>
      <td><input value="${r.order_type||''}" placeholder="e.g. CN DXB VCT RN" onchange="fieldChange(${r.id},'order_type',this.value)"></td>
      <td><input value="${r.po_number||''}" onchange="fieldChange(${r.id},'po_number',this.value)"></td>
      <td style="font-size:11px;">${r.requester_email||''}</td>
      <td><span class="status">${r.status}</span></td>
      <td style="font-size:11px; white-space:nowrap;">${new Date(r.created_at).toLocaleString('en-GB')}</td>
      <td><button class="btn-secondary" onclick="downloadOne(${r.id})">⬇</button></td>
    </tr>
  `).join('');
}

async function fieldChange(id, field, value) {
  try {
    await api('/api/grv/requests/'+id, { method:'PUT', body: JSON.stringify({[field]: value}) });
    showToast('Saved');
  } catch(e) { showToast(e.message, true); }
}

function downloadOne(id) {
  const url = '/api/grv/requests/'+id+'/export-excel';
  fetch(url, { headers: { 'x-auth-token': TOKEN } })
    .then(r => { if (!r.ok) throw new Error('Download failed'); return r.blob(); })
    .then(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'grv_request.xlsx';
      a.click();
    }).catch(e => showToast(e.message, true));
}

function downloadAll() {
  const dateParam = currentDateParam();
  const url = '/api/grv/requests/export-all?date=' + encodeURIComponent(dateParam);
  fetch(url, { headers: { 'x-auth-token': TOKEN } })
    .then(r => { if (!r.ok) throw new Error('No requests found for this range'); return r.blob(); })
    .then(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'GRV_Returns.zip';
      a.click();
    }).catch(e => showToast(e.message, true));
}

if (TOKEN && USER) { initApp(); }
</script>
</body>
</html>
