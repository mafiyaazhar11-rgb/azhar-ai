<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Trips — Expense Splitter</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#070e1a; --surface:#0d1b2e; --card:#0f2040; --border:#1e3a5f;
    --gold:#c9a84c; --gold2:#e8c878; --text:#f0f6ff; --muted:#a9b4c9; --faint:#5c6a85;
    --red:#e57373; --amber:#e8b84c; --green:#6fcf97;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:radial-gradient(ellipse 1200px 800px at 15% 0%, rgba(139,105,20,0.16), transparent 60%), var(--void); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh;}
  a{color:inherit; text-decoration:none;}
  #gate{position:fixed; inset:0; background:var(--void); display:flex; align-items:center; justify-content:center; z-index:999;}
  #gate .spin{width:28px; height:28px; border-radius:50%; border:2px solid var(--border); border-top-color:var(--gold); animation:spin .9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .topbar{position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between; padding:14px 20px; background:rgba(7,14,26,0.9); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); flex-wrap:wrap; gap:8px;}
  .hub-title{font-family:'Montserrat',sans-serif; font-weight:700; font-size:14px; letter-spacing:.5px;}
  .whoami{font-size:11.5px; color:var(--muted);}
  .btn{font-size:12.5px; padding:8px 16px; border-radius:8px; border:1px solid var(--border); background:rgba(255,255,255,0.03); color:var(--text); cursor:pointer;}
  .btn:hover{border-color:var(--gold); color:#fff;}
  .btn.primary{background:var(--gold); color:#1a1204; font-weight:600; border-color:var(--gold);}
  .btn.danger{border-color:var(--red); color:var(--red); background:transparent;}
  .btn.small{padding:5px 11px; font-size:11px;}
  .wrap{max-width:900px; margin:0 auto; padding:18px;}
  .head h1{font-family:'Fraunces',serif; font-size:24px; font-weight:600; margin-bottom:4px;}
  .head p{color:var(--muted); font-size:12.5px;}
  .head-row{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:18px; flex-wrap:wrap; gap:12px;}
  .section{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px;}
  .section-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px;}
  .section-head h2{font-size:14px; font-weight:600;}
  input, select, textarea{width:100%; background:#0d1b2e; border:1px solid var(--border); border-radius:7px; padding:9px 10px; color:var(--text); font-size:13px; font-family:'Inter',sans-serif; outline:none;}
  label.fl{font-size:10px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:4px;}
  .field{margin-bottom:10px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .empty-state{padding:24px; text-align:center; color:var(--muted); font-size:12.5px;}
  .trip-card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:10px; cursor:pointer; transition:border-color .15s;}
  .trip-card:hover{border-color:var(--gold);}
  .trip-card .tname{font-weight:700; font-size:15px; margin-bottom:4px;}
  .trip-card .tmeta{font-size:11.5px; color:var(--muted); display:flex; gap:12px; flex-wrap:wrap;}
  .pill{font-size:10px; padding:2px 8px; border-radius:10px; white-space:nowrap; display:inline-block;}
  .pill.green{background:rgba(111,207,151,0.15); color:var(--green);}
  .pill.muted{background:rgba(169,180,201,0.12); color:var(--muted);}
  .member-chip{display:inline-flex; align-items:center; gap:6px; background:rgba(201,168,76,0.12); border:1px solid rgba(201,168,76,0.3); color:var(--gold2); font-size:11.5px; padding:4px 10px; border-radius:20px; margin:2px 4px 2px 0;}
  .kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:14px;}
  .kpi-card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px;}
  .kpi-card .lbl{font-size:9px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em; margin-bottom:5px;}
  .kpi-card .val{font-size:20px; font-weight:700; color:var(--gold);}
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{text-align:left; padding:8px 8px; color:var(--faint); text-transform:uppercase; font-size:9.5px; letter-spacing:.05em; border-bottom:1px solid var(--border);}
  td{padding:9px 8px; border-bottom:1px solid rgba(255,255,255,0.04); vertical-align:middle;}
  .expense-row .cat{font-size:10px; color:var(--faint);}
  .photo-thumbs{display:flex; gap:5px;}
  .photo-thumbs img{width:34px; height:34px; object-fit:cover; border-radius:5px; border:1px solid var(--border); cursor:pointer;}
  .balance-pos{color:var(--green); font-weight:700;}
  .balance-neg{color:var(--red); font-weight:700;}
  .balance-zero{color:var(--muted); font-weight:600;}
  .settle-row{display:flex; align-items:center; gap:8px; padding:9px 10px; background:var(--card); border:1px solid var(--border); border-radius:8px; margin-bottom:6px; font-size:12.5px; flex-wrap:wrap;}
  .settle-row .arrow{color:var(--gold);}
  .modal-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); align-items:flex-start; justify-content:center; z-index:200; overflow-y:auto; padding:24px 12px;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; max-width:480px; width:100%; margin-top:20px;}
  .modal h3{margin-bottom:14px; font-size:16px;}
  .photo-input-row{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:10px;}
  .photo-slot{border:1px dashed var(--border); border-radius:8px; padding:8px; text-align:center; font-size:10px; color:var(--faint); cursor:pointer; position:relative; min-height:70px; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .photo-slot img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .photo-slot input{position:absolute; inset:0; opacity:0; cursor:pointer;}
  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--card); border:1px solid var(--gold); padding:12px 18px; border-radius:8px; font-size:13px; z-index:300; max-width:90%;}
  .toast.error{border-color:var(--red);}
  .lightbox{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:400; align-items:center; justify-content:center; padding:20px;}
  .lightbox.show{display:flex;}
  .lightbox img{max-width:100%; max-height:100%; border-radius:8px;}
  .lightbox .close{position:absolute; top:16px; right:20px; color:#fff; font-size:26px; cursor:pointer;}
  @media(max-width:520px){ .grid2{grid-template-columns:1fr;} }
</style>
</head>
<body>

<div id="gate"><div class="spin"></div></div>

<div class="topbar">
  <div class="hub-title">🧳 MY TRIPS</div>
  <div style="display:flex; align-items:center; gap:12px;">
    <span class="whoami" id="whoami"></span>
    <button class="btn small" onclick="doLogout()">Log Out</button>
  </div>
</div>

<div class="wrap">

  <!-- TRIP LIST VIEW -->
  <div id="listView">
    <div class="head-row">
      <div class="head">
        <h1>Your Trips</h1>
        <p>Only trips your organiser has given you access to show up here.</p>
      </div>
    </div>
    <div id="tripsList"></div>
  </div>

  <!-- TRIP DETAIL VIEW -->
  <div id="detailView" style="display:none;">
    <div class="head-row">
      <div class="head">
        <button class="btn small" onclick="backToList()" style="margin-bottom:8px;">&larr; All my trips</button>
        <h1 id="dTripName">—</h1>
        <p id="dTripMeta"></p>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn small" id="dToggleStatusBtn" onclick="toggleTripStatus()"></button>
        <button class="btn primary" onclick="openAddExpenseModal()">➕ Add Spend</button>
      </div>
    </div>

    <div class="section" id="summarySection">
      <div class="section-head"><h2>📊 Summary</h2></div>
      <div class="kpi-row" id="kpiRow"></div>
      <div id="settlementBox"></div>
    </div>

    <div class="section">
      <div class="section-head"><h2>👥 Members</h2></div>
      <div id="membersChips"></div>
    </div>

    <div class="section">
      <div class="section-head"><h2>💸 Expenses</h2></div>
      <div style="overflow-x:auto;">
        <table id="expenseTable">
          <thead><tr><th>Date</th><th>Spent By</th><th>Category</th><th>Description</th><th style="text-align:right;">Amount</th><th>Receipts</th><th></th></tr></thead>
          <tbody id="expenseTbody"></tbody>
        </table>
      </div>
      <div id="expenseEmpty" class="empty-state" style="display:none;">No expenses logged yet.</div>
    </div>
  </div>
</div>

<!-- Add Expense Modal -->
<div class="modal-overlay" id="addExpenseModal">
  <div class="modal">
    <h3>Add Spend</h3>
    <div class="grid2">
      <div class="field"><label class="fl">Spent By</label><select id="ae-spender"></select></div>
      <div class="field"><label class="fl">Category</label>
        <select id="ae-category">
          <option>Hotel</option><option>Food</option><option>Entertainment</option><option>Car/Petrol</option><option>Other</option>
        </select>
      </div>
    </div>
    <div class="grid2">
      <div class="field"><label class="fl">Amount</label><input id="ae-amount" type="number" step="0.01" placeholder="0.00"></div>
      <div class="field"><label class="fl">Date</label><input id="ae-date" type="date"></div>
    </div>
    <div class="field"><label class="fl">Description (optional)</label><input id="ae-description" placeholder="e.g. Dinner at marina, fuel for SUV"></div>
    <div class="field">
      <label class="fl">Receipt Photos (up to 3)</label>
      <div class="photo-input-row">
        <label class="photo-slot" id="ae-slot-1">📷 Photo 1<input type="file" accept="image/*" capture="environment" onchange="aePhotoPicked(1,this)"></label>
        <label class="photo-slot" id="ae-slot-2">📷 Photo 2<input type="file" accept="image/*" capture="environment" onchange="aePhotoPicked(2,this)"></label>
        <label class="photo-slot" id="ae-slot-3">📷 Photo 3<input type="file" accept="image/*" capture="environment" onchange="aePhotoPicked(3,this)"></label>
      </div>
    </div>
    <div style="display:flex; gap:10px; margin-top:8px;">
      <button class="btn primary" style="flex:1;" onclick="submitAddExpense()">Save Spend</button>
      <button class="btn" onclick="closeModal('addExpenseModal')">Cancel</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="close" onclick="closeLightbox()">✕</span>
  <img id="lightboxImg" src="">
</div>

<script>
var TRIP_TOKEN = localStorage.getItem('trip_member_token') || null;
var ME = null;
var CURRENT_TRIP = null; // { id, name, status, members }
var AE_PHOTOS = {1:null, 2:null, 3:null};

function tripHeaders(json){
  var h = { 'x-trip-token': TRIP_TOKEN };
  if (json) h['Content-Type'] = 'application/json';
  return h;
}
function showToast(msg, isError){
  var t = document.createElement('div');
  t.className = 'toast' + (isError ? ' error' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 3200);
}
function fmtMoney(n){ return (n<0?'-':'') + Math.abs(n).toLocaleString('en-AE',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(d){ return d ? new Date(d).toLocaleDateString('en-AE', {day:'2-digit', month:'short', year:'numeric'}) : '—'; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeLightbox(){ document.getElementById('lightbox').classList.remove('show'); }
function openLightbox(src){ document.getElementById('lightboxImg').src = src; document.getElementById('lightbox').classList.add('show'); }

async function boot(){
  if (!TRIP_TOKEN) { window.location.href = '/trip-login'; return; }
  try {
    var r = await fetch('/api/trip-guest-auth/me', { headers: tripHeaders() });
    if (!r.ok) { localStorage.removeItem('trip_member_token'); window.location.href = '/trip-login'; return; }
    ME = await r.json();
    document.getElementById('gate').style.display = 'none';
    document.getElementById('whoami').textContent = 'Logged in as ' + ME.displayName;
    await loadTrips();
  } catch(e) { console.error(e); window.location.href = '/trip-login'; }
}
async function doLogout(){
  try { await fetch('/api/trip-guest-auth/logout', { method:'POST', headers: tripHeaders() }); } catch(e){}
  localStorage.removeItem('trip_member_token');
  window.location.href = '/trip-login';
}

// ── TRIP LIST ──
async function loadTrips(){
  try {
    var r = await fetch('/api/trip-guest/trips', { headers: tripHeaders() });
    var d = await r.json();
    var list = document.getElementById('tripsList');
    if (!d.trips || !d.trips.length) { list.innerHTML = '<div class="empty-state">No trips have been shared with you yet. Ask your organiser to grant access.</div>'; return; }
    list.innerHTML = d.trips.map(function(t){
      var members = t.members || [];
      var statusPill = t.status === 'active' ? '<span class="pill green">Active</span>' : '<span class="pill muted">Closed</span>';
      return '<div class="trip-card" onclick="openTrip('+t.id+')">'+
        '<div class="tname">'+escapeHtml(t.name)+' '+statusPill+'</div>'+
        '<div class="tmeta"><span>👥 '+members.length+' members</span><span>💰 Gross: '+fmtMoney(parseFloat(t.gross_total)||0)+'</span><span>🧾 '+t.expense_count+' expenses</span></div>'+
      '</div>';
    }).join('');
  } catch(e) { showToast('Failed to load trips', true); }
}

// ── TRIP DETAIL ──
async function openTrip(id){
  try {
    var r = await fetch('/api/trip-guest/trips/'+id, { headers: tripHeaders() });
    var d = await r.json();
    if (!r.ok) return showToast(d.error || 'Failed to load trip', true);
    CURRENT_TRIP = d.trip;
    document.getElementById('listView').style.display = 'none';
    document.getElementById('detailView').style.display = 'block';
    await refreshTripDetail();
  } catch(e) { showToast('Failed to open trip', true); }
}
function backToList(){
  CURRENT_TRIP = null;
  document.getElementById('detailView').style.display = 'none';
  document.getElementById('listView').style.display = 'block';
  loadTrips();
}
async function refreshTripDetail(){
  if (!CURRENT_TRIP) return;
  document.getElementById('dTripName').textContent = CURRENT_TRIP.name;
  document.getElementById('dTripMeta').textContent = (CURRENT_TRIP.members||[]).length + ' members · ' + (CURRENT_TRIP.status==='active'?'Active':'Closed');
  var toggleBtn = document.getElementById('dToggleStatusBtn');
  toggleBtn.textContent = CURRENT_TRIP.status === 'active' ? '🏁 Close Trip' : '↩ Reopen Trip';
  document.getElementById('membersChips').innerHTML = (CURRENT_TRIP.members||[]).map(function(m){ return '<span class="member-chip">'+escapeHtml(m)+'</span>'; }).join('');
  await Promise.all([loadExpenses(), loadSummary()]);
}
async function toggleTripStatus(){
  var newStatus = CURRENT_TRIP.status === 'active' ? 'closed' : 'active';
  try {
    var r = await fetch('/api/trip-guest/trips/'+CURRENT_TRIP.id+'/status', { method:'PUT', headers: tripHeaders(true), body: JSON.stringify({ status: newStatus }) });
    var d = await r.json();
    if (!r.ok) return showToast(d.error || 'Failed', true);
    CURRENT_TRIP.status = newStatus;
    showToast(newStatus === 'closed' ? 'Trip closed — final settlement below' : 'Trip reopened');
    await refreshTripDetail();
  } catch(e) { showToast('Failed to update trip', true); }
}

// ── EXPENSES ──
async function loadExpenses(){
  try {
    var r = await fetch('/api/trip-guest/trips/'+CURRENT_TRIP.id+'/expenses', { headers: tripHeaders() });
    var d = await r.json();
    var tbody = document.getElementById('expenseTbody');
    var empty = document.getElementById('expenseEmpty');
    if (!d.expenses || !d.expenses.length) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    tbody.innerHTML = d.expenses.map(function(e){
      var photos = '';
      for (var i=1;i<=e.photo_count;i++){
        var src = '/api/trip-guest/trips/'+CURRENT_TRIP.id+'/expenses/'+e.id+'/photos/'+i+'?token='+encodeURIComponent(TRIP_TOKEN);
        photos += '<img src="'+src+'" onclick="openLightbox(\''+src+'\')">';
      }
      return '<tr class="expense-row">'+
        '<td>'+fmtDate(e.expense_date)+'</td>'+
        '<td>'+escapeHtml(e.spender_name)+'</td>'+
        '<td><span class="cat">'+escapeHtml(e.category)+'</span></td>'+
        '<td>'+escapeHtml(e.description||'—')+'</td>'+
        '<td style="text-align:right;font-weight:600;">'+fmtMoney(parseFloat(e.amount))+'</td>'+
        '<td><div class="photo-thumbs">'+(photos||'<span style="color:var(--faint);font-size:11px;">—</span>')+'</div></td>'+
        '<td><button class="btn small danger" onclick="deleteExpense('+e.id+')">🗑</button></td>'+
      '</tr>';
    }).join('');
  } catch(e) { showToast('Failed to load expenses', true); }
}
async function deleteExpense(id){
  if (!confirm('Delete this expense?')) return;
  try {
    var r = await fetch('/api/trip-guest/trips/'+CURRENT_TRIP.id+'/expenses/'+id, { method:'DELETE', headers: tripHeaders() });
    var d = await r.json();
    if (!r.ok) return showToast(d.error || 'Failed', true);
    showToast('Expense deleted');
    await Promise.all([loadExpenses(), loadSummary()]);
  } catch(e) { showToast('Failed to delete expense', true); }
}

function openAddExpenseModal(){
  var sel = document.getElementById('ae-spender');
  sel.innerHTML = '<option value="" disabled selected>— pick who spent this —</option>' + (CURRENT_TRIP.members||[]).map(function(m){ return '<option value="'+escapeHtml(m)+'">'+escapeHtml(m)+'</option>'; }).join('');
  document.getElementById('ae-category').value = 'Hotel';
  document.getElementById('ae-amount').value = '';
  document.getElementById('ae-description').value = '';
  document.getElementById('ae-date').value = new Date().toISOString().slice(0,10);
  AE_PHOTOS = {1:null, 2:null, 3:null};
  for (var i=1;i<=3;i++){ document.getElementById('ae-slot-'+i).innerHTML = '📷 Photo '+i+'<input type="file" accept="image/*" capture="environment" onchange="aePhotoPicked('+i+',this)">'; }
  openModal('addExpenseModal');
}
function aePhotoPicked(slot, input){
  var file = input.files[0];
  if (!file) return;
  AE_PHOTOS[slot] = file;
  var reader = new FileReader();
  reader.onload = function(e){
    var el = document.getElementById('ae-slot-'+slot);
    el.innerHTML = '<img src="'+e.target.result+'">';
    var newInput = document.createElement('input');
    newInput.type = 'file'; newInput.accept = 'image/*'; newInput.setAttribute('capture','environment');
    newInput.onchange = function(){ aePhotoPicked(slot, newInput); };
    el.appendChild(newInput);
  };
  reader.readAsDataURL(file);
}
async function submitAddExpense(){
  var spender = document.getElementById('ae-spender').value;
  var category = document.getElementById('ae-category').value;
  var amount = document.getElementById('ae-amount').value;
  var date = document.getElementById('ae-date').value;
  var description = document.getElementById('ae-description').value;
  if (!spender) return showToast('Pick who spent this', true);
  if (!amount || parseFloat(amount) <= 0) return showToast('Enter a valid amount', true);
  try {
    var fd = new FormData();
    fd.append('spenderName', spender);
    fd.append('category', category);
    fd.append('amount', amount);
    fd.append('expenseDate', date);
    fd.append('description', description);
    [1,2,3].forEach(function(i){ if (AE_PHOTOS[i]) fd.append('photos', AE_PHOTOS[i]); });
    var r = await fetch('/api/trip-guest/trips/'+CURRENT_TRIP.id+'/expenses', { method:'POST', headers: { 'x-trip-token': TRIP_TOKEN }, body: fd });
    var d = await r.json();
    if (!r.ok) return showToast(d.error || 'Failed to add expense', true);
    closeModal('addExpenseModal');
    showToast('Spend added');
    await Promise.all([loadExpenses(), loadSummary()]);
  } catch(e) { showToast('Failed to add expense', true); }
}

// ── SUMMARY ──
async function loadSummary(){
  try {
    var r = await fetch('/api/trip-guest/trips/'+CURRENT_TRIP.id+'/summary', { headers: tripHeaders() });
    var d = await r.json();
    if (!r.ok) return;
    document.getElementById('kpiRow').innerHTML =
      '<div class="kpi-card"><div class="lbl">Gross Total</div><div class="val">'+fmtMoney(d.grossTotal)+'</div></div>'+
      '<div class="kpi-card"><div class="lbl">Members</div><div class="val">'+d.memberCount+'</div></div>'+
      '<div class="kpi-card"><div class="lbl">Equal Share Each</div><div class="val">'+fmtMoney(d.equalShare)+'</div></div>'+
      '<div class="kpi-card"><div class="lbl">Expenses Logged</div><div class="val">'+d.expenseCount+'</div></div>';

    var peopleHtml = '<table style="margin-top:6px;"><thead><tr><th>Name</th><th style="text-align:right;">Spent</th><th style="text-align:right;">Fair Share</th><th style="text-align:right;">Balance</th></tr></thead><tbody>' +
      d.people.map(function(p){
        var cls = p.balance > 0.01 ? 'balance-pos' : (p.balance < -0.01 ? 'balance-neg' : 'balance-zero');
        var note = p.balance > 0.01 ? 'gets back' : (p.balance < -0.01 ? 'owes' : 'settled');
        return '<tr><td>'+escapeHtml(p.name)+'</td><td style="text-align:right;">'+fmtMoney(p.spent)+'</td><td style="text-align:right;">'+fmtMoney(p.share)+'</td>'+
          '<td style="text-align:right;" class="'+cls+'">'+fmtMoney(Math.abs(p.balance))+' <span style="font-size:10px;font-weight:400;color:var(--faint);">('+note+')</span></td></tr>';
      }).join('') + '</tbody></table>';

    var settleHtml = '';
    if (d.settlements.length) {
      settleHtml = '<div style="margin-top:14px;"><div style="font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;">'+(d.status==='closed'?'Final Settlement':'Settlement If Trip Ended Now')+'</div>' +
        d.settlements.map(function(s){
          return '<div class="settle-row"><strong>'+escapeHtml(s.from)+'</strong> <span class="arrow">→ pays →</span> <strong>'+escapeHtml(s.to)+'</strong> <span style="margin-left:auto;font-weight:700;color:var(--gold);">'+fmtMoney(s.amount)+'</span></div>';
        }).join('') + '</div>';
    } else if (d.expenseCount > 0) {
      settleHtml = '<div style="margin-top:14px;color:var(--muted);font-size:12.5px;">Everyone is settled — spend is perfectly equal.</div>';
    }

    document.getElementById('settlementBox').innerHTML = peopleHtml + settleHtml;
  } catch(e) { showToast('Failed to load summary', true); }
}

boot();
</script>
</body>
</html>
