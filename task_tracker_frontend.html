<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Tracker — AZHAR-AI</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#070e1a; --surface:#0d1b2e; --card:#0f2040; --border:#1e3a5f;
    --gold:#c9a84c; --gold2:#e8c878; --text:#f0f6ff; --muted:#a9b4c9; --faint:#5c6a85;
    --red:#e57373; --amber:#e8b84c; --green:#6fcf97;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:radial-gradient(ellipse 1200px 800px at 15% 0%, rgba(139,105,20,0.16), transparent 60%), var(--void); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh;}
  a{color:inherit; text-decoration:none;}
  #gate{position:fixed; inset:0; background:var(--void); display:flex; align-items:center; justify-content:center; z-index:999;}
  #gate .spin{width:28px; height:28px; border-radius:50%; border:2px solid var(--border); border-top-color:var(--gold); animation:spin .9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .topbar{position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between; padding:14px 28px; background:rgba(7,14,26,0.9); backdrop-filter:blur(10px); border-bottom:1px solid var(--border);}
  .back-link{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px;}
  .hub-title{font-family:'Montserrat',sans-serif; font-weight:700; font-size:15px; letter-spacing:.5px;}
  .btn{font-size:12.5px; padding:8px 16px; border-radius:8px; border:1px solid var(--border); background:rgba(255,255,255,0.03); color:var(--text); cursor:pointer;}
  .btn:hover{border-color:var(--gold); color:#fff;}
  .btn.primary{background:var(--gold); color:#1a1204; font-weight:600; border-color:var(--gold);}
  .btn.small{padding:5px 11px; font-size:11px;}
  .wrap{max-width:1200px; margin:0 auto; padding:28px;}
  .head h1{font-family:'Fraunces',serif; font-size:28px; font-weight:600; margin-bottom:4px;}
  .head p{color:var(--muted); font-size:13px;}
  .head-row{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; flex-wrap:wrap; gap:14px;}
  .section{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:18px;}
  .section-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  .section-head h2{font-size:15px; font-weight:600;}
  .tabs{display:flex; gap:2px; margin-bottom:16px;}
  .tab{padding:8px 16px; background:transparent; border:1px solid var(--border); color:var(--muted); font-size:11px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; font-family:'Montserrat',sans-serif;}
  .tab.on{background:rgba(201,168,76,0.15); border-color:var(--gold); color:var(--gold);}
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{text-align:left; padding:8px 10px; color:var(--faint); text-transform:uppercase; font-size:10px; letter-spacing:.05em; border-bottom:1px solid var(--border);}
  td{padding:10px; border-bottom:1px solid rgba(255,255,255,0.04); vertical-align:top;}
  .empty-state{padding:24px; text-align:center; color:var(--muted); font-size:12.5px;}
  .pill{font-size:10px; padding:2px 8px; border-radius:10px; white-space:nowrap; display:inline-block;}
  .pill.green{background:rgba(111,207,151,0.15); color:var(--green);}
  .pill.red{background:rgba(229,115,115,0.15); color:var(--red);}
  .pill.amber{background:rgba(232,184,76,0.15); color:var(--amber);}
  .row-overdue td{background:rgba(229,115,115,0.08);}
  .modal-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; z-index:200;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:24px; max-width:460px; width:90%;}
  .modal h3{margin-bottom:14px; font-size:16px;}
  .modal select, .modal input, .modal textarea{width:100%; background:#0d1b2e; border:1px solid var(--border); border-radius:7px; padding:8px 10px; color:var(--text); font-size:13px; margin-bottom:12px; font-family:'Inter',sans-serif;}
  .modal textarea{resize:vertical; min-height:70px;}
  .modal label{font-size:11px; color:var(--faint); text-transform:uppercase; display:block; margin-bottom:4px;}
  .toast{position:fixed; bottom:20px; right:20px; background:var(--card); border:1px solid var(--gold); padding:12px 18px; border-radius:8px; font-size:13px; z-index:300;}
  .toast.error{border-color:var(--red);}
  .kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px;}
  .kpi-card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px;}
  .kpi-card .lbl{font-size:9px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px;}
  .kpi-card .val{font-size:24px; font-weight:700; color:var(--gold);}
  .kpi-card.warn .val{color:var(--red);}
  .kpi-card.ok .val{color:var(--green);}
  .task-title{font-weight:600; margin-bottom:2px;}
  .task-comment{color:var(--muted); font-size:11.5px; max-width:340px;}
  .submit-box{margin-top:6px;}
  .submit-box textarea{width:100%; background:#0d1b2e; border:1px solid var(--border); border-radius:6px; padding:7px 9px; color:var(--text); font-size:12px; font-family:'Inter',sans-serif; resize:vertical; min-height:50px; margin-bottom:6px;}
</style>
</head>
<body>

<div id="gate"><div class="spin"></div></div>

<div class="topbar">
  <a href="/" class="back-link">&larr; Dashboard Hub</a>
  <div class="hub-title">🗒️ TASK TRACKER</div>
  <div style="display:flex; gap:10px;">
    <button class="btn primary" id="addTaskBtn" onclick="openAddModal()" style="display:none;">➕ Assign Task</button>
  </div>
</div>

<div class="wrap">
  <div class="head-row">
    <div class="head">
      <h1>Task Tracker</h1>
      <p id="headSub">Tasks assigned to you, with a deadline. Write a short message when you're done — no file needed.</p>
    </div>
  </div>

  <!-- MANAGEMENT VIEW — superadmin/subadmin only -->
  <div id="managementSection" style="display:none;">
    <div class="kpi-row" id="mgmtKpiRow"></div>
    <div class="section">
      <div class="section-head">
        <h2>All Tasks</h2>
        <div class="tabs" id="mgmtTabs">
          <button class="tab on" data-status="" onclick="mgmtFilter('')">All</button>
          <button class="tab" data-status="pending" onclick="mgmtFilter('pending')">Pending</button>
          <button class="tab" data-status="submitted" onclick="mgmtFilter('submitted')">Submitted</button>
        </div>
      </div>
      <div id="mgmtBody"><div class="empty-state">Loading…</div></div>
    </div>
  </div>

  <!-- MY TASKS — everyone -->
  <div class="section">
    <div class="section-head">
      <h2>My Tasks</h2>
      <span id="myTaskCount" style="font-size:11px; color:var(--muted);"></span>
    </div>
    <div id="myTasksBody"><div class="empty-state">Loading…</div></div>
  </div>
</div>

<!-- Add Task modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h3>➕ Assign a Task</h3>
    <label>Task Name</label>
    <input type="text" id="taskTitle" placeholder="e.g. Reconcile August pallet counts">
    <label>Comments / Instructions</label>
    <textarea id="taskComments" placeholder="Any details they need to complete this..."></textarea>
    <label>Assign To</label>
    <select id="taskAssignee"><option value="">Loading users…</option></select>
    <label>Deadline</label>
    <input type="date" id="taskDeadline">
    <div style="display:flex; gap:10px; margin-top:6px;">
      <button class="btn primary" style="flex:1;" onclick="submitAddTask()">Assign Task</button>
      <button class="btn" onclick="closeAddModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
var AUTH_TOKEN = localStorage.getItem('azhar_token') || null;
var AUTH_USER = null;
var CAN_MANAGE = false;
var MGMT_TASKS = [];
var MGMT_FILTER = '';

function authHeaders(json){
  var h = { 'x-auth-token': AUTH_TOKEN };
  if (json) h['Content-Type'] = 'application/json';
  return h;
}
function showToast(msg, isError){
  var t = document.createElement('div');
  t.className = 'toast' + (isError ? ' error' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 3500);
}
function fmtDate(d){ return d ? new Date(d).toLocaleDateString('en-AE', {day:'2-digit', month:'short', year:'numeric'}) : '—'; }
function isOverdue(t){ return t.status === 'pending' && t.deadline && new Date(t.deadline) < new Date(new Date().toDateString()); }
function statusPill(t){
  if (t.status === 'submitted') return '<span class="pill green">✓ Submitted</span>';
  if (isOverdue(t)) return '<span class="pill red">⚠ Overdue</span>';
  return '<span class="pill amber">Pending</span>';
}

async function boot(){
  if (!AUTH_TOKEN) { window.location.href = '/'; return; }
  try {
    var r = await fetch('/api/auth/me', { headers: authHeaders() });
    if (!r.ok) { localStorage.removeItem('azhar_token'); window.location.href = '/'; return; }
    AUTH_USER = await r.json();
    CAN_MANAGE = (AUTH_USER.role === 'superadmin' || AUTH_USER.role === 'subadmin');
    var hasAccess = AUTH_USER.role === 'superadmin' || (AUTH_USER.dashboards||[]).indexOf('task_tracker') !== -1;
    if (!hasAccess) { alert('You don\'t have access to Task Tracker. Ask your admin to enable it for your account.'); window.location.href = '/'; return; }
    document.getElementById('gate').style.display = 'none';
    if (CAN_MANAGE) {
      document.getElementById('managementSection').style.display = 'block';
      document.getElementById('addTaskBtn').style.display = 'inline-block';
      document.getElementById('headSub').textContent = 'Assign tasks by username, set a deadline, and see who has submitted.';
      loadAssignableUsers();
    }
    await refreshAll();
  } catch(e) { console.error(e); }
}
async function refreshAll(){
  await loadMyTasks();
  if (CAN_MANAGE) await loadMgmtTasks();
}

// ── My Tasks (everyone) ──
async function loadMyTasks(){
  try {
    var r = await fetch('/api/tasks/mine', { headers: authHeaders() });
    var d = await r.json();
    var tasks = d.tasks || [];
    document.getElementById('myTaskCount').textContent = tasks.length + ' task' + (tasks.length===1?'':'s');
    var body = document.getElementById('myTasksBody');
    if (!tasks.length) { body.innerHTML = '<div class="empty-state">No tasks assigned to you right now.</div>'; return; }
    var html = '<table><thead><tr><th>Task</th><th>Assigned By</th><th>Deadline</th><th>Status</th><th></th></tr></thead><tbody>';
    tasks.forEach(function(t){
      html += '<tr class="' + (isOverdue(t)?'row-overdue':'') + '">' +
        '<td><div class="task-title">' + esc(t.title) + '</div>' + (t.comments ? '<div class="task-comment">' + esc(t.comments) + '</div>' : '') + '</td>' +
        '<td>' + esc(t.assigned_by_full_name || t.assigned_by_username) + '</td>' +
        '<td>' + fmtDate(t.deadline) + '</td>' +
        '<td>' + statusPill(t) + '</td>' +
        '<td>' + (t.status === 'pending'
          ? '<div class="submit-box"><textarea id="sub-' + t.id + '" placeholder="What did you do? Write a short message..."></textarea><button class="btn small primary" onclick="submitTask(' + t.id + ')">Mark Done</button></div>'
          : '<div class="task-comment" style="max-width:260px;"><b style="color:var(--green);">Your note:</b> ' + esc(t.submission_text||'') + '<br><span style="color:var(--faint);">' + fmtDate(t.submitted_at) + '</span></div>') +
        '</td></tr>';
    });
    html += '</tbody></table>';
    body.innerHTML = html;
  } catch(e) { console.error(e); }
}
async function submitTask(id){
  var ta = document.getElementById('sub-'+id);
  var text = (ta.value||'').trim();
  if (!text) { showToast('Write a short message first.', true); return; }
  try {
    var r = await fetch('/api/tasks/'+id+'/submit', { method:'PUT', headers: authHeaders(true), body: JSON.stringify({ submissionText: text }) });
    var d = await r.json();
    if (!r.ok) { showToast(d.error || 'Could not submit.', true); return; }
    showToast('✓ Task marked done.');
    await refreshAll();
  } catch(e) { showToast('Error: '+e.message, true); }
}

// ── Management (superadmin/subadmin) ──
function mgmtFilter(status){
  MGMT_FILTER = status;
  document.querySelectorAll('#mgmtTabs .tab').forEach(function(b){ b.classList.toggle('on', b.dataset.status === status); });
  renderMgmtTable();
}
async function loadMgmtTasks(){
  try {
    var r = await fetch('/api/tasks', { headers: authHeaders() });
    var d = await r.json();
    MGMT_TASKS = d.tasks || [];
    var pending = MGMT_TASKS.filter(function(t){ return t.status === 'pending'; }).length;
    var overdue = MGMT_TASKS.filter(isOverdue).length;
    var submitted = MGMT_TASKS.filter(function(t){ return t.status === 'submitted'; }).length;
    document.getElementById('mgmtKpiRow').innerHTML =
      '<div class="kpi-card"><div class="lbl">Total Tasks</div><div class="val">' + MGMT_TASKS.length + '</div></div>' +
      '<div class="kpi-card"><div class="lbl">Pending</div><div class="val">' + pending + '</div></div>' +
      '<div class="kpi-card warn"><div class="lbl">Overdue</div><div class="val">' + overdue + '</div></div>' +
      '<div class="kpi-card ok"><div class="lbl">Submitted</div><div class="val">' + submitted + '</div></div>';
    renderMgmtTable();
  } catch(e) { console.error(e); }
}
function renderMgmtTable(){
  var tasks = MGMT_FILTER ? MGMT_TASKS.filter(function(t){ return t.status === MGMT_FILTER; }) : MGMT_TASKS;
  var body = document.getElementById('mgmtBody');
  if (!tasks.length) { body.innerHTML = '<div class="empty-state">No tasks here.</div>'; return; }
  var html = '<table><thead><tr><th>Task</th><th>Assigned To</th><th>Deadline</th><th>Status</th><th>Submission</th><th></th></tr></thead><tbody>';
  tasks.forEach(function(t){
    html += '<tr class="' + (isOverdue(t)?'row-overdue':'') + '">' +
      '<td><div class="task-title">' + esc(t.title) + '</div>' + (t.comments ? '<div class="task-comment">' + esc(t.comments) + '</div>' : '') + '</td>' +
      '<td>' + esc(t.assigned_to_full_name || t.assigned_to_username) + '</td>' +
      '<td>' + fmtDate(t.deadline) + '</td>' +
      '<td>' + statusPill(t) + '</td>' +
      '<td class="task-comment" style="max-width:260px;">' + (t.submission_text ? esc(t.submission_text) : '—') + '</td>' +
      '<td style="white-space:nowrap;">' +
        (t.status === 'submitted' ? '<button class="btn small" onclick="reopenTask(' + t.id + ')">↺ Reopen</button> ' : '') +
        '<button class="btn small" onclick="deleteTask(' + t.id + ')" style="border-color:var(--red);color:var(--red);">✕ Delete</button>' +
      '</td></tr>';
  });
  html += '</tbody></table>';
  body.innerHTML = html;
}
async function reopenTask(id){
  try {
    var r = await fetch('/api/tasks/'+id+'/reopen', { method:'PUT', headers: authHeaders() });
    if (!r.ok) { var d = await r.json(); showToast(d.error||'Could not reopen.', true); return; }
    showToast('Task reopened.');
    await loadMgmtTasks();
  } catch(e) { showToast('Error: '+e.message, true); }
}
async function deleteTask(id){
  if (!confirm('Delete this task? This cannot be undone.')) return;
  try {
    var r = await fetch('/api/tasks/'+id, { method:'DELETE', headers: authHeaders() });
    if (!r.ok) { var d = await r.json(); showToast(d.error||'Could not delete.', true); return; }
    showToast('Task deleted.');
    await loadMgmtTasks();
  } catch(e) { showToast('Error: '+e.message, true); }
}

// ── Add Task modal ──
async function loadAssignableUsers(){
  try {
    var r = await fetch('/api/tasks/assignable-users', { headers: authHeaders() });
    var d = await r.json();
    var sel = document.getElementById('taskAssignee');
    sel.innerHTML = '<option value="">Select a user…</option>' +
      (d.users||[]).map(function(u){ return '<option value="' + u.username + '">' + esc(u.full_name || u.username) + ' (' + u.username + ')</option>'; }).join('');
  } catch(e) { console.error(e); }
}
function openAddModal(){
  document.getElementById('taskTitle').value = '';
  document.getElementById('taskComments').value = '';
  document.getElementById('taskDeadline').value = '';
  document.getElementById('addModal').classList.add('show');
}
function closeAddModal(){ document.getElementById('addModal').classList.remove('show'); }
async function submitAddTask(){
  var title = document.getElementById('taskTitle').value.trim();
  var comments = document.getElementById('taskComments').value.trim();
  var assignedTo = document.getElementById('taskAssignee').value;
  var deadline = document.getElementById('taskDeadline').value;
  if (!title) { showToast('Give the task a name.', true); return; }
  if (!assignedTo) { showToast('Pick who this is assigned to.', true); return; }
  try {
    var r = await fetch('/api/tasks', { method:'POST', headers: authHeaders(true), body: JSON.stringify({ title:title, comments:comments, assignedTo:assignedTo, deadline: deadline||null }) });
    var d = await r.json();
    if (!r.ok) { showToast(d.error || 'Could not assign task.', true); return; }
    showToast('✓ Task assigned.');
    closeAddModal();
    await loadMgmtTasks();
  } catch(e) { showToast('Error: '+e.message, true); }
}
function esc(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

boot();
</script>
</body>
</html>
